[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeintel"
version = "1.1.0.dev0"
description = "Experimental offline code-context retrieval and evaluation lab"
readme = "README.package.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
    "apsw>=3.53.4.0,<4",
    "tree-sitter>=0.26.0,<0.27",
    "tree-sitter-python>=0.25.0,<0.26",
    "tree-sitter-javascript>=0.25.0,<0.26",
    "tree-sitter-typescript>=0.23.2,<0.24",
]


[project.scripts]
codeintel = "codeintel.lab.entry:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["codeintel*"]

[tool.setuptools.package-data]
"codeintel.lab" = ["fixture/*.py", "fixture/*.ts", "fixture/*.js"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
