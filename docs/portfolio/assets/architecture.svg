<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc"><title id="title">CodeIntel: implemented offline boundary</title><desc id="desc">Source to verified bounded packet. Agent consumption is unimplemented and unmeasured.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#367d88"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="38" y="44" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#183449">CodeIntel · implemented offline boundary</text><text x="38" y="74" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#183449">Literal code retrieval. No model or autonomous agent in this path.</text><rect x="40" y="120" width="270" height="80" rx="10" fill="#f1f7f8" stroke="#367d88"/><text x="56" y="151" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#183449">Local Python / TS / JS</text><text x="56" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#183449">Safe reads + SHA-256</text><rect x="370" y="120" width="320" height="80" rx="10" fill="#f1f7f8" stroke="#367d88"/><text x="386" y="151" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#183449">Immutable source generation</text><text x="386" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#183449">Full rebuild after a source change</text><rect x="750" y="120" width="280" height="80" rx="10" fill="#f1f7f8" stroke="#367d88"/><text x="766" y="151" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#183449">tree-sitter chunks</text><text x="766" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#183449">Literal spans + syntax candidates</text><path d="M310 160 L370 160" stroke="#367d88" stroke-width="2" fill="none" marker-end="url(#a)" /><path d="M690 160 L750 160" stroke="#367d88" stroke-width="2" fill="none" marker-end="url(#a)" /><rect x="750" y="265" width="280" height="80" rx="10" fill="#f1f7f8" stroke="#367d88"/><text x="766" y="296" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#183449">SQLite / FTS5</text><text x="766" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#183449">Lexical + symbol + heuristic calls</text><path d="M890 200 L890 265" stroke="#367d88" stroke-width="2" fill="none" marker-end="url(#a)" /><rect x="370" y="265" width="320" height="80" rx="10" fill="#f1f7f8" stroke="#367d88"/><text x="386" y="296" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#183449">Complete packet boundary</text><text x="386" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#183449">Literal hashes · duplicates · bytes</text><path d="M750 305 L690 305" stroke="#367d88" stroke-width="2" fill="none" marker-end="url(#a)" /><rect x="40" y="265" width="270" height="80" rx="10" fill="#f1f7f8" stroke="#367d88"/><text x="56" y="296" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#183449">JSON + opt-in receipt</text><text x="56" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#183449">Emission is observable</text><path d="M370 305 L310 305" stroke="#367d88" stroke-width="2" fill="none" marker-end="url(#a)" /><rect x="40" y="425" width="400" height="84" rx="10" fill="#f1f7f8" stroke="#367d88"/><text x="56" y="456" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#183449">Verify selected files and literals</text><text x="56" y="480" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#183449">Match at verification time OR STALE_SOURCE</text><path d="M175 345 L175 425" stroke="#367d88" stroke-width="2" fill="none" marker-end="url(#a)" /><rect x="560" y="425" width="500" height="84" rx="10" fill="#fff8ec" stroke="#a17735" stroke-dasharray="7 5"/><text x="580" y="457" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183449">Downstream agent / consumer</text><text x="580" y="485" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#183449">Not implemented or evaluated in this offline project</text><path d="M310 325 L610 425" stroke="#367d88" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="6 5"/><rect x="1080" y="265" width="160" height="80" rx="10" fill="#f1f7f8" stroke="#367d88"/><text x="1096" y="296" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#183449">Query</text><text x="1096" y="320" font-family="Arial, sans-serif" font-size="14" fill="#183449">Authored input</text><path d="M1080 305 L1030 305" stroke="#367d88" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="40" y="568" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#183449">Verification does not re-run relevance or establish that an old EMPTY result is still complete.</text><text x="40" y="599" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#183449">No token/cost savings, ranking superiority, autonomy or production certification is implied.</text></svg>