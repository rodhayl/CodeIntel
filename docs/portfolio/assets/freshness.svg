<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="530" viewBox="0 0 1280 530" role="img" aria-labelledby="title desc"><title id="title">Scripted stale-packet demonstration</title><desc id="desc">Six observable steps on a disposable synthetic copy. No autonomous bug fix.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#367d88"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="36" y="45" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#183449">A changed selected file invalidates the old packet</text><text x="36" y="76" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#183449">Scripted deterministic demonstration on a disposable synthetic copy</text><rect x="38" y="135" width="370" height="85" rx="10" fill="#f1f7f8" stroke="#367d88"/><text x="54" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#183449">1  QUERY</text><text x="54" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#183449">reserve_seats</text><path d="M408 177 L448 177" stroke="#367d88" stroke-width="2" fill="none" marker-end="url(#a)" /><rect x="448" y="135" width="370" height="85" rx="10" fill="#f1f7f8" stroke="#367d88"/><text x="464" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#183449">2  PACKET</text><text x="464" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#183449">Literal + file/source hashes</text><path d="M818 177 L858 177" stroke="#367d88" stroke-width="2" fill="none" marker-end="url(#a)" /><rect x="858" y="135" width="370" height="85" rx="10" fill="#f1f7f8" stroke="#367d88"/><text x="874" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#183449">3  EDIT</text><text x="874" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#183449">Script changes + to −</text><rect x="38" y="290" width="370" height="85" rx="10" fill="#f1f7f8" stroke="#367d88"/><text x="54" y="321" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#183449">4  VERIFY</text><text x="54" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#183449">STALE_SOURCE</text><path d="M408 332 L448 332" stroke="#367d88" stroke-width="2" fill="none" marker-end="url(#a)" /><rect x="448" y="290" width="370" height="85" rx="10" fill="#f1f7f8" stroke="#367d88"/><text x="464" y="321" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#183449">5  QUERY</text><text x="464" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#183449">Full new snapshot</text><path d="M818 332 L858 332" stroke="#367d88" stroke-width="2" fill="none" marker-end="url(#a)" /><rect x="858" y="290" width="370" height="85" rx="10" fill="#f1f7f8" stroke="#367d88"/><text x="874" y="321" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#183449">6  PACKET</text><text x="874" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#183449">Updated literal verified</text><path d="M1185 220 L1185 248" stroke="#367d88" stroke-width="2" fill="none" marker-end="url(#a)" /><path d="M1185 248 L220 248 L220 290" stroke="#367d88" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="38" y="438" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#183449">Only selected-file changes are rejected by verify. A new query checks repository freshness.</text><text x="38" y="472" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#183449">The script supplies the edit. No agent diagnoses, fixes, receives or retains code in this demo.</text></svg>